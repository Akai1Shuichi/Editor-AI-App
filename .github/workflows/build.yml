name: Build & Release Editor Video App

on:
  push:
    branches:
      - master
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
          - os: macos-latest
            platform_name: macOS
          - os: ubuntu-latest
            platform_name: Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0 libegl1 libxkbcommon-x11-0 zip

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean editor_video_app.spec

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path dist/* -DestinationPath EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip .

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip .

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}
          path: EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip

  release:
    name: Publish to public releases repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: EditorVideoApp-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          repository: Akai1Shuichi/Video-Editor-AI-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Editor Video AI ${{ github.ref_name }}
          target_commitish: master
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          body: |
            Bản phát hành Editor Video AI ${{ github.ref_name }}.

            Chọn đúng gói cài đặt cho hệ điều hành của bạn ở phần Assets bên dưới.
