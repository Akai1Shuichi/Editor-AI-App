name: Build & Release Editor Video App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
          - os: macos-latest
            platform_name: macOS
          - os: ubuntu-latest
            platform_name: Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0 libegl1 libxkbcommon-x11-0 zip

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean editor_video_app.spec

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'docs/tutorial/hướng dẫn cài đặt - windows.txt' -Destination dist -ErrorAction Stop
          Compress-Archive -Path dist/* -DestinationPath "EditorVideoApp-$($env:RELEASE_TAG)-${{ matrix.platform_name }}.zip"

      - name: Package macOS ZIP
        if: runner.os == 'macOS'
        run: |
          cp 'docs/tutorial/hướng dẫn cài đặt - macos.txt' dist/
          cd dist && zip -r "../EditorVideoApp-${RELEASE_TAG}-${{ matrix.platform_name }}.zip" .

      - name: Package Linux ZIP
        if: runner.os == 'Linux'
        run: cd dist && zip -r "../EditorVideoApp-${RELEASE_TAG}-${{ matrix.platform_name }}.zip" .

      - name: Publish ZIP to repository release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Editor Video AI ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: EditorVideoApp-${{ env.RELEASE_TAG }}-${{ matrix.platform_name }}.zip
          fail_on_unmatched_files: true
          body: |
            Bản phát hành Editor Video AI ${{ env.RELEASE_TAG }}.

            Chọn đúng gói cài đặt cho hệ điều hành của bạn ở phần Assets bên dưới.
