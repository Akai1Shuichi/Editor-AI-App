name: Build & Release Editor Video App

on:
  push:
    branches:
      - master
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
          - os: macos-latest
            platform_name: macOS
          - os: ubuntu-latest
            platform_name: Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0 libegl1 libxkbcommon-x11-0 zip

      - name: Run unit tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean editor_video_app.spec

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path dist/* -DestinationPath EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip .

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}
          path: EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EditorVideoApp-${{ github.ref_name }}-${{ matrix.platform_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
