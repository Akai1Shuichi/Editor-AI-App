name: Test build Editor Video App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows
          - os: macos-latest
            platform_name: macOS
          - os: ubuntu-latest
            platform_name: Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0 libegl1 libxkbcommon-x11-0 zip

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean editor_video_app.spec

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path dist/*, docs/tutorial/install-windows.md -DestinationPath EditorVideoApp-test-${{ github.run_number }}-${{ matrix.platform_name }}.zip

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../EditorVideoApp-test-${{ github.run_number }}-${{ matrix.platform_name }}.zip .

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../EditorVideoApp-test-${{ github.run_number }}-${{ matrix.platform_name }}.zip .

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: EditorVideoApp-test-${{ github.run_number }}-${{ matrix.platform_name }}
          path: EditorVideoApp-test-${{ github.run_number }}-${{ matrix.platform_name }}.zip
